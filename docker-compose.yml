  firefly-server:
    image: firefly/firefly-server:${FIREFLY_VERSION:-1.0.0}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        FIREFLY_VERSION: ${FIREFLY_VERSION:-1.0.0}
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
#    depends_on:
#      postgres:
#        condition: service_healthy
    environment:
      # Container bind addresses. Host exposure is controlled by the ports section.
      - FIREFLY_CONFIG_PROFILE=${FIREFLY_CONFIG_PROFILE:-pg}
      - FIREFLY_NODE_MODE=${FIREFLY_NODE_MODE:-standalone}
      - FIREFLY_NODE_NAME=${FIREFLY_NODE_NAME:-firefly-standalone}
      - FIREFLY_NODE_ROLES=${FIREFLY_NODE_ROLES:-api,gateway,scheduler}
      - FIREFLY_PLUGINS=${FIREFLY_PLUGINS:-metrics-prometheus}
      - FIREFLY_ADMIN_HTTP_HOST=0.0.0.0
      - FIREFLY_METRICS_PROMETHEUS_HOST=0.0.0.0
      - FIREFLY_TRACING_OPENTELEMETRY_ENABLED
      - FIREFLY_TRACING_OPENTELEMETRY_ENDPOINT
      - FIREFLY_TRACING_OPENTELEMETRY_SERVICE_NAME
      - FIREFLY_TRACING_OPENTELEMETRY_SAMPLING_RATIO
      - FIREFLY_TRACING_OPENTELEMETRY_EXPORT_TIMEOUT_MS
      - FIREFLY_TRACING_OPENTELEMETRY_HEADERS
      - FIREFLY_STORE_TYPE
      - FIREFLY_JDBC_URL
      - FIREFLY_JDBC_USERNAME
      - FIREFLY_JDBC_PASSWORD
      - FIREFLY_JDBC_DIALECT
      - FIREFLY_JDBC_SCHEMA_MODE
      - FIREFLY_SECURITY_JWT_ENABLED
      - FIREFLY_SECURITY_JWT_SECRET
      - FIREFLY_SECURITY_JWT_ISSUER=${FIREFLY_SECURITY_JWT_ISSUER:-firefly}
      - FIREFLY_EXECUTOR_REGISTRATION_AUTO_CREATE_DEFINITION=${FIREFLY_EXECUTOR_REGISTRATION_AUTO_CREATE_DEFINITION:-true}
      - JAVA_OPTS=${JAVA_OPTS:--XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError}
    ports:
      - "${FIREFLY_GATEWAY_PORT:-9700}:9700"
      - "${FIREFLY_ADMIN_API_PORT:-9710}:9710"
      - "${FIREFLY_METRICS_PORT:-9711}:9711"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:9710/api/health"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 6

  firefly-admin-ui:
    image: firefly/firefly-admin-ui:${FIREFLY_VERSION:-1.0.0}
    build:
      context: ./ui/admin
      dockerfile: Dockerfile
      args:
        FIREFLY_VERSION: ${FIREFLY_VERSION:-1.0.0}
    init: true
    restart: unless-stopped
#    depends_on:
#      firefly-server:
#        condition: service_healthy
    environment:
      FIREFLY_ADMIN_UI_HOST: 0.0.0.0
      FIREFLY_ADMIN_UI_PORT: 9720
      FIREFLY_ADMIN_API: http://firefly-server:9710
      FIREFLY_ADMIN_API_TIMEOUT_MS: ${FIREFLY_ADMIN_API_TIMEOUT_MS:-5000}
      FIREFLY_ADMIN_SESSION_IDLE_TIMEOUT: ${FIREFLY_ADMIN_SESSION_IDLE_TIMEOUT:-30m}
      FIREFLY_ADMIN_SESSION_COOKIE_SECURE: ${FIREFLY_ADMIN_SESSION_COOKIE_SECURE:-false}
    ports:
      - "${FIREFLY_ADMIN_UI_PORT:-9720}:9720"

volumes:
  firefly-postgres:
