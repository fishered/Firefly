plugins {
    id "java-library"
}

dependencies {
    api project(":libs:scheduler-core")
    api project(":transports:netty-protocol")

    implementation "io.netty:netty-codec:4.1.115.Final"
    implementation "io.netty:netty-handler:4.1.115.Final"
    implementation "io.netty:netty-transport:4.1.115.Final"
    implementation "com.fasterxml.jackson.core:jackson-databind:2.17.2"
    compileOnly "org.projectlombok:lombok:1.18.34"
    annotationProcessor "org.projectlombok:lombok:1.18.34"

    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.2"
}

def delombokOutput = layout.buildDirectory.dir("generated/sources/delombok/main")
def delombok = tasks.register("delombok", JavaExec) {
    group = "documentation"
    description = "Expands Lombok-generated API types for Javadoc."
    classpath = configurations.annotationProcessor
    mainClass = "lombok.launch.Main"
    inputs.dir("src/main/java")
    outputs.dir(delombokOutput)
    dependsOn(configurations.compileClasspath)
    doFirst {
        delete(delombokOutput)
        args "delombok", file("src/main/java").absolutePath,
                "--classpath", configurations.compileClasspath.asPath,
                "-d", delombokOutput.get().asFile.absolutePath
    }
}

tasks.named("javadoc", Javadoc) {
    dependsOn(delombok)
    setSource(delombokOutput)
}
