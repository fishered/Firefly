plugins {
    id "java-library"
}

dependencies {
    api project(":libs:firefly-store-api")
    api project(":libs:firefly-domain")
    api project(":libs:firefly-execution")
    api project(":libs:firefly-scheduling")
    api project(":libs:firefly-batch")
    api project(":libs:firefly-catalog")
    api project(":libs:firefly-cluster")
    api project(":libs:firefly-executor")
    api project(":libs:firefly-security")
    api project(":libs:firefly-trigger")
    api project(":libs:firefly-runtime-support")

    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testImplementation project(":libs:firefly-engine")
    testImplementation project(":libs:firefly-handler")
    testImplementation "com.h2database:h2:2.2.224"
    testImplementation "org.testcontainers:junit-jupiter:1.17.3"
    testImplementation "org.testcontainers:postgresql:1.17.3"
    testImplementation "org.testcontainers:mysql:1.17.3"
    testImplementation "org.testcontainers:toxiproxy:1.17.3"
    testImplementation "org.postgresql:postgresql:42.7.7"
    testImplementation "com.mysql:mysql-connector-j:8.0.32"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.2"
}

tasks.named("processResources") {
    from(rootProject.file("scripts/postgresql/init.sql")) {
        into("com/firefly/store/jdbc/schema")
        rename { "postgresql.sql" }
    }
}

tasks.withType(Test).configureEach {
    systemProperty(
            "firefly.postgresql.init-script",
            rootProject.file("scripts/postgresql/init.sql").absolutePath
    )
}

tasks.named("test") {
    useJUnitPlatform {
        excludeTags("real-database", "stress")
    }
}

tasks.register("realDatabaseTest", Test) {
    description = "Runs PostgreSQL/MySQL concurrency tests against Testcontainers."
    group = "verification"
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags("real-database")
    }
}

tasks.register("stressTest", Test) {
    description = "Runs the PostgreSQL scheduler and outbox stress suite."
    group = "verification"
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    maxHeapSize = System.getProperty("firefly.stress.maxHeap", "2g")
    useJUnitPlatform {
        includeTags("stress")
    }
    systemProperties System.getProperties().findAll { key, ignored ->
        key.toString().startsWith("firefly.stress.")
                || key.toString().startsWith("firefly.jdbc.")
    }
    def jfrPath = System.getProperty("firefly.stress.jfr.path")
    if (jfrPath != null && !jfrPath.isBlank()) {
        jvmArgs "-XX:StartFlightRecording=filename=${new File(jfrPath).absolutePath},settings=profile,dumponexit=true"
    }
}
