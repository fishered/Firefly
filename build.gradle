import groovy.xml.XmlSlurper

plugins {
    id "base"
    id "com.vanniktech.maven.publish" version "0.37.0" apply false
}

allprojects {
    group = "io.github.fishered"
    version = "1.1.3"

    if (tasks.findByName("prepareKotlinBuildScriptModel") == null) {
        tasks.register("prepareKotlinBuildScriptModel") {
            group = "ide"
            description = "No-op compatibility task for IntelliJ IDEA Gradle import."
        }
    }
}

def aggregatorProjectPaths = [
        ":apis", ":clients", ":examples", ":integrations", ":libs", ":platform",
        ":plugins", ":server", ":stores", ":transports", ":ui"
] as Set

subprojects {
    if (!aggregatorProjectPaths.contains(project.path) && project.path != ":platform:firefly-bom") {
        apply plugin: "java-library"

        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(21)
            }
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = 21
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        testLogging {
            events "passed", "skipped", "failed"
        }
    }

    tasks.withType(Javadoc).configureEach {
        options.encoding = "UTF-8"
        options.charSet = "UTF-8"
        options.docEncoding = "UTF-8"
        options.addStringOption("Xdoclint:none", "-quiet")
    }

    tasks.withType(Jar).configureEach {
        manifest.attributes("Implementation-Version": project.version.toString())
    }

    if (aggregatorProjectPaths.contains(project.path)) {
        afterEvaluate {
            def children = childProjects.values().collect { it.path }
            tasks.named("assemble") { dependsOn(children.collect { "${it}:assemble" }) }
            tasks.named("check") { dependsOn(children.collect { "${it}:check" }) }
        }
    }
}

def publishedProjects = [
        ":platform:firefly-bom",
        ":libs:firefly-batch",
        ":libs:firefly-domain",
        ":libs:firefly-catalog",
        ":libs:firefly-execution",
        ":libs:firefly-scheduling",
        ":libs:firefly-store-api",
        ":libs:firefly-trigger",
        ":libs:firefly-operations",
        ":libs:firefly-handler",
        ":libs:firefly-cluster",
        ":libs:firefly-security",
        ":libs:firefly-executor",
        ":libs:firefly-engine",
        ":libs:firefly-runtime-support",
        ":libs:scheduler-core",
        ":plugins:plugin-api",
        ":transports:netty-protocol",
        ":transports:netty",
        ":clients:executor-netty",
        ":integrations:firefly-remote-adapter",
        ":integrations:firefly-spring-boot-autoconfigure",
        ":integrations:firefly-spring-boot-starter"
]

