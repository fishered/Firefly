def configuredMavenLocalRepo = providers.gradleProperty("firefly.maven.local.repo")
        .orElse(providers.environmentVariable("FIREFLY_MAVEN_LOCAL_REPO"))
        .orElse(providers.systemProperty("maven.repo.local"))
        .orNull
def fireflyLocalRepo = configuredMavenLocalRepo
        ?: new File(System.getProperty("user.home"), ".m2/repository").absolutePath
def hasSigningKey = providers.gradleProperty("signingInMemoryKey").isPresent()
def hasSigningPassword = providers.gradleProperty("signingInMemoryKeyPassword").isPresent()
def hasMavenCentralCredentials = providers.gradleProperty("mavenCentralUsername").isPresent()
        && providers.gradleProperty("mavenCentralPassword").isPresent()
def centralPublishRequested = gradle.startParameter.taskNames.any {
    def taskName = it.toLowerCase()
    taskName.contains("publishandreleasetomavencentral")
            || taskName.contains("publishallpublicationstomavencentralrepository")
            || taskName.contains("publishmavenpublicationtomavencentralrepository")
}

if (centralPublishRequested && (!hasSigningKey || !hasSigningPassword)) {
    throw new GradleException("Maven Central publishing requires a GPG signing key. Configure signingInMemoryKey and signingInMemoryKeyPassword.")
}
if (centralPublishRequested && !hasMavenCentralCredentials) {
    throw new GradleException("Maven Central publishing requires mavenCentralUsername and mavenCentralPassword.")
}

configure(publishedProjects.collect { project(it) }) {
    apply plugin: "com.vanniktech.maven.publish"

    if (project.path != ":platform:firefly-bom") {
        tasks.named("jar", Jar) {
            from(rootProject.file("LICENSE")) {
                into("META-INF")
            }
            from(rootProject.file("NOTICE")) {
                into("META-INF")
            }
        }
    }

    mavenPublishing {
        publishToMavenCentral()

        if (hasSigningKey && hasSigningPassword) {
            signAllPublications()
        }

        pom {
            name = "Firefly ${project.name}"
            description = publishedProjectDescriptions[project.path]
            inceptionYear = "2026"
            url = "https://github.com/fishered/Firefly"

            licenses {
                license {
                    name = "The Apache License, Version 2.0"
                    url = "https://www.apache.org/licenses/LICENSE-2.0.txt"
                    distribution = "repo"
                }
            }

            developers {
                developer {
                    id = "fishered"
                    name = "fishered"
                    url = "https://github.com/fishered"
                }
            }

            scm {
                url = "https://github.com/fishered/Firefly"
                connection = "scm:git:git://github.com/fishered/Firefly.git"
                developerConnection = "scm:git:ssh://git@github.com/fishered/Firefly.git"
            }
        }
    }

    publishing {
        repositories {
            maven {
                name = "fireflyLocal"
                url = uri(fireflyLocalRepo)
            }
            maven {
                name = "fireflyCompatibility"
                url = rootProject.layout.buildDirectory.dir("compatibility/firefly-repo")
            }
        }
    }
}

tasks.register("publishToMavenLocal") {
    group = "publishing"
    description = "Publishes the Firefly public starter and its local dependency chain."
    if (configuredMavenLocalRepo == null) {
        dependsOn(publishedProjects.collect { "${it}:publishToMavenLocal" })
    } else {
        dependsOn(publishedProjects.collect {
            "${it}:publishMavenPublicationToFireflyLocalRepository"
        })
    }
}

tasks.register("verifyModuleBoundaries") {
    group = "verification"
    description = "Checks aggregator projects and prevents new runtime coupling to scheduler-core."
    doLast {
        def aggregators = [":apis", ":clients", ":examples", ":integrations", ":libs", ":platform",
                           ":plugins", ":server", ":stores", ":transports", ":ui"]
        aggregators.each { path ->
            def project = project(path)
            if (!project.plugins.hasPlugin("base")) {
                throw new GradleException("Aggregator ${path} must apply the base plugin")
            }
            if (project.plugins.hasPlugin("java") || project.plugins.hasPlugin("java-library")) {
                throw new GradleException("Aggregator ${path} must not apply a Java plugin")
            }
        }
        subprojects.findAll { it.path != ":libs:scheduler-core" }.each { project ->
            project.configurations.findAll { it.canBeResolved || it.canBeConsumed }.each { configuration ->
                configuration.dependencies.each { dependency ->
                    if (dependency instanceof ProjectDependency && dependency.dependencyProject.path == ":libs:scheduler-core") {
                        throw new GradleException("${project.path}:${configuration.name} must depend on split modules, not scheduler-core")
                    }
                }
            }
        }
    }

}

tasks.named("check") {
    dependsOn("verifyModuleBoundaries")
}

tasks.register("publishToFireflyMavenLocal") {
    group = "publishing"
    description = "Publishes Firefly artifacts to -Pfirefly.maven.local.repo or FIREFLY_MAVEN_LOCAL_REPO."
    dependsOn(publishedProjects.collect {
        "${it}:publishMavenPublicationToFireflyLocalRepository"
    })
}

tasks.register("verifyMavenCentralPublication") {
    group = "verification"
    description = "Builds tests, POMs, sources, and Javadocs for every Maven Central module without uploading."
    // Only published library projects have test tasks; top-level aggregators use
    // the base plugin and intentionally do not expose a project-level test task.
    dependsOn(publishedProjects.findAll { it != ":platform:firefly-bom" }.collect { "${it}:test" })
    dependsOn(publishedProjects.collectMany {
        if (it == ":platform:firefly-bom") {
            return ["${it}:generatePomFileForMavenPublication"]
        }
        return [
            "${it}:generatePomFileForMavenPublication",
            "${it}:sourcesJar",
            "${it}:plainJavadocJar"
        ]
    })
    dependsOn("verifyFireflyBomPom")
}

tasks.register("verifyFireflyBomPom") {
    group = "verification"
    description = "Verifies the generated Firefly BOM coordinates and managed module versions."
    dependsOn(":platform:firefly-bom:generatePomFileForMavenPublication")

    doLast {
        def pomFile = project(":platform:firefly-bom")
                .layout.buildDirectory
                .file("publications/maven/pom-default.xml")
                .get().asFile
        def pom = new XmlSlurper(false, false).parse(pomFile)
        def expectedArtifacts = publishedProjects
                .findAll { it != ":platform:firefly-bom" }
                .collect { project(it).name }
                .toSet()
        def managedDependencies = pom.dependencyManagement.dependencies.dependency
        def actualArtifacts = managedDependencies.collect { it.artifactId.text() }.toSet()

        if (pom.groupId.text() != project.group.toString()
                || pom.artifactId.text() != "firefly-bom"
                || pom.version.text() != project.version.toString()
                || pom.packaging.text() != "pom") {
            throw new GradleException("Generated firefly-bom POM has invalid coordinates or packaging: ${pomFile}")
        }
        if (actualArtifacts != expectedArtifacts) {
            throw new GradleException("Generated firefly-bom POM manages ${actualArtifacts}, expected ${expectedArtifacts}")
        }
        managedDependencies.each { dependency ->
            if (dependency.groupId.text() != project.group.toString()
                    || dependency.version.text() != project.version.toString()) {
                throw new GradleException("Invalid managed dependency in firefly-bom POM: ${dependency}")
            }
        }
    }
}

def defaultSpringBootCompatibilityVersions = ["3.3.5", "3.4.12", "3.5.8", "4.0.0"]
def springBootCompatibilityVersions = (
        findProperty("compat.springBootVersions")
                ?: defaultSpringBootCompatibilityVersions.join(",")
).split(",")
        .collect { it.trim() }
        .findAll { !it.isBlank() }
def compatibilityMavenExecutable = providers.gradleProperty("compat.maven.executable")
        .orElse(providers.environmentVariable("MAVEN_EXECUTABLE"))
        .orElse(System.getProperty("os.name").toLowerCase(Locale.ROOT).contains("windows") ? "mvn.cmd" : "mvn")
def compatibilityConsumerSource = layout.projectDirectory.dir("compatibility/spring-boot-consumer")
def compatibilityBuildRoot = layout.buildDirectory.dir("compatibility/spring-boot-consumer")
def compatibilityFireflyRepo = layout.buildDirectory.dir("compatibility/firefly-repo")
def compatibilityMavenRepo = layout.buildDirectory.dir("compatibility/m2")
def publishCompatibilityArtifacts = publishedProjects.collect {
    "${it}:publishMavenPublicationToFireflyCompatibilityRepository"
}

springBootCompatibilityVersions.each { springBootVersion ->
    def taskSuffix = springBootVersion.replaceAll(/[^A-Za-z0-9]/, "")
    def consumerDir = compatibilityBuildRoot.map { it.dir(springBootVersion) }
    def mavenRepoDir = compatibilityMavenRepo.map { it.dir(springBootVersion) }
    def prepareTask = tasks.register("prepareSpringBootCompatibility${taskSuffix}", Sync) {
        from(compatibilityConsumerSource)
        into(consumerDir)
        filesMatching("settings-central.xml") {
            expand(fireflyRepoUrl: compatibilityFireflyRepo.get().asFile.toURI().toString())
        }
    }
    tasks.register("verifySpringBootCompatibility${taskSuffix}", Exec) {
        group = "verification"
        description = "Verifies Firefly starter consumption with Spring Boot ${springBootVersion} using Maven Central."
        dependsOn(publishCompatibilityArtifacts)
        dependsOn(prepareTask)
        workingDir = consumerDir.get().asFile
        executable = compatibilityMavenExecutable.get()
        doFirst {
            delete(new File(mavenRepoDir.get().asFile, "io/github/fishered"))
        }
        args(
                "--batch-mode",
                "--no-transfer-progress",
                "-U",
                "-s",
                consumerDir.get().file("settings-central.xml").asFile.absolutePath,
                "-gs",
                consumerDir.get().file("settings-central.xml").asFile.absolutePath,
                "-Dmaven.repo.local=${mavenRepoDir.get().asFile.absolutePath}",
                "-Dfirefly.version=${project.version}",
                "-Dspring-boot.version=${springBootVersion}",
                "-Dexpected.boot.line=${springBootVersion.tokenize(".").take(2).join(".")}",
                "test"
        )
    }
}

tasks.register("verifySpringBootCompatibility") {
    group = "verification"
    description = "Runs isolated Maven consumer tests against the supported Spring Boot compatibility matrix."
    dependsOn(springBootCompatibilityVersions.collect {
        "verifySpringBootCompatibility${it.replaceAll(/[^A-Za-z0-9]/, "")}"
    })
}

tasks.register("verifyPluginCompatibilityMatrix") {
    group = "verification"
    description = "Validates the plugin, protocol, database, and rolling-upgrade compatibility matrix."
    dependsOn(
            ":plugins:plugin-api:test",
            ":plugins:tracing-opentelemetry:test",
            ":transports:netty:test",
            ":stores:jdbc:test"
    )
    doLast {
        def matrix = new groovy.json.JsonSlurper().parse(rootProject.file("compatibility/firefly-rolling-upgrade-matrix.json"))
        assert matrix.matrixVersion == 1 : "unsupported compatibility matrix version"
        assert matrix.nodes.size() >= 2 : "rolling matrix must include old and new nodes"
        assert matrix.hostVersions.containsAll(matrix.nodes.version) : "hostVersions must cover every matrix node"
        def protocolMin = matrix.nodes*.executorProtocol*.getAt(0).max()
        def protocolMax = matrix.nodes*.executorProtocol*.getAt(1).min()
        assert protocolMin <= protocolMax : "nodes have no common executor protocol"
        def schemaMin = matrix.nodes*.databaseSchema*.getAt(0).max()
        def schemaMax = matrix.nodes*.databaseSchema*.getAt(1).min()
        assert schemaMin <= schemaMax : "nodes have no common database schema"
        def versionParts = { String value ->
            def parts = value.tokenize(".").take(3).collect { it.find(/^[0-9]+/) as int }
            while (parts.size() < 3) parts.add(0)
            parts
        }
        def compareVersion = { String left, String right ->
            def a = versionParts(left)
            def b = versionParts(right)
            for (int index = 0; index < 3; index++) {
                if (a[index] != b[index]) return a[index] <=> b[index]
            }
            0
        }
        matrix.plugins.each { plugin ->
            assert plugin.api[0] <= plugin.api[1] : "invalid API range for ${plugin.id}"
            assert plugin.executorProtocol[0] <= plugin.executorProtocol[1] : "invalid protocol range for ${plugin.id}"
            assert plugin.databaseSchema[0] <= plugin.databaseSchema[1] : "invalid schema range for ${plugin.id}"
            assert plugin.rollingUpgradeSafe : "${plugin.id} is not declared rolling-upgrade safe"
            matrix.nodes.each { node ->
                assert compareVersion(node.version, plugin.firefly[0]) >= 0 &&
                        compareVersion(node.version, plugin.firefly[1]) <= 0 :
                        "${plugin.id} does not support Firefly ${node.version}"
                assert plugin.api[0] <= node.pluginApi && node.pluginApi <= plugin.api[1] :
                        "${plugin.id} does not support Firefly ${node.version} plugin API"
                assert plugin.executorProtocol[0] <= node.executorProtocol[1] &&
                        node.executorProtocol[0] <= plugin.executorProtocol[1] :
                        "${plugin.id} has no protocol overlap with Firefly ${node.version}"
                assert plugin.databaseSchema[0] <= node.databaseSchema[1] &&
                        node.databaseSchema[0] <= plugin.databaseSchema[1] :
                        "${plugin.id} has no database schema overlap with Firefly ${node.version}"
            }
        }
        def tracingSource = rootProject.file("plugins/tracing-opentelemetry/src/main/java/com/firefly/plugin/tracing/OpenTelemetryTracingPlugin.java").getText("UTF-8")
        def tracingMatrix = matrix.plugins.find { it.id == "tracing-opentelemetry" }
        def declaration = (tracingSource =~ /runtimeCompatibility\(\)\s*\{[\s\S]*?compatibility\(\),\s*"([^"]+)",\s*"([^"]+)",\s*(\d+),\s*(\d+),\s*(\d+),\s*(\d+),\s*(true|false)/)
        assert declaration.find() : "tracing-opentelemetry runtimeCompatibility declaration not found"
        assert declaration.group(1) == tracingMatrix.firefly[0].toString() &&
                declaration.group(2) == tracingMatrix.firefly[1].toString() &&
                declaration.group(3) as int == tracingMatrix.executorProtocol[0] &&
                declaration.group(4) as int == tracingMatrix.executorProtocol[1] &&
                declaration.group(5) as int == tracingMatrix.databaseSchema[0] &&
                declaration.group(6) as int == tracingMatrix.databaseSchema[1] &&
                declaration.group(7).toBoolean() == tracingMatrix.rollingUpgradeSafe :
                "tracing-opentelemetry runtimeCompatibility() drifted from compatibility matrix"
        println("Firefly plugin rolling-upgrade matrix valid: ${matrix.hostVersions.join(', ')}")
    }
}

tasks.register("verifyReleaseVersion") {
    group = "verification"
    description = "Checks that release version defaults and examples agree with the Gradle project version."
    doLast {
        def expected = project.version.toString()
        def files = [".env.example", "docker-compose.yml", "Dockerfile", "ui/admin/Dockerfile",
                     "README.md", "docs/deployment.md"]
                .collect { rootProject.file(it) }
        files.each { file ->
            def text = file.getText("UTF-8")
            assert !text.contains("FIREFLY_VERSION:-1.0.0") && !text.contains("FIREFLY_VERSION=1.0.0") &&
                    !text.contains("ARG FIREFLY_VERSION=1.0.0") : "stale Docker version default in ${file}"
            if (file.name == ".env.example") assert text.contains("FIREFLY_VERSION=${expected}")
            if (file.name == "docker-compose.yml") assert text.contains("FIREFLY_VERSION:-${expected}")
            if (file.name == "README.md" || file.name == "deployment.md") {
                assert !text.contains("firefly-server:1.0.0") && !text.contains("firefly-admin-ui:1.0.0") :
                        "stale Docker image example in ${file}"
            }
        }
    }
}

tasks.named("check") {
    dependsOn("verifyPluginCompatibilityMatrix")
    dependsOn("verifyReleaseVersion")
}

