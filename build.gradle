        ":libs:firefly-domain"                           : "Stable Firefly scheduling and execution domain model.",
        ":libs:firefly-catalog"                           : "Scheduler configuration catalog contracts and in-memory implementation.",
        ":libs:firefly-execution"                         : "Execution lifecycle, command, and tracing contracts.",
        ":libs:firefly-scheduling"                         : "Calendar, blackout, dependency, and scheduling semantics.",
        ":libs:firefly-store-api"                          : "Persistence contracts and scheduler storage records.",
        ":libs:firefly-trigger"                            : "Event trigger inbox and bounded backfill services.",
        ":libs:firefly-operations"                        : "Execution timeline and alert evaluation services.",
        ":libs:firefly-handler"                            : "Job handler registry and idempotency wrappers.",
        ":libs:firefly-cluster"                            : "Scheduler node, shard lease, and coordination contracts.",
        ":libs:firefly-security"                           : "Admin identity, JWT, integration keys, and password hashing.",
        ":libs:firefly-executor"                           : "Executor registry and transport-neutral dispatch contracts.",
        ":libs:firefly-engine"                             : "Scheduler engine orchestration and in-memory runtime implementations.",
        ":libs:firefly-runtime-support"                    : "In-memory stores, audit, metrics, and lifecycle support.",
        ":libs:scheduler-core"                            : "Core scheduling domain, execution model, routing, and storage contracts for Firefly.",
