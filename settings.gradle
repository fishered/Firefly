pluginManagement {
    repositories {
        String mavenLocalFlag = providers.gradleProperty("firefly.repositories.mavenLocal")
                .orElse(providers.environmentVariable("FIREFLY_REPOSITORIES_MAVEN_LOCAL"))
                .orNull
        boolean useMavenLocal = mavenLocalFlag != null
                && ["true", "1", "yes"].contains(mavenLocalFlag.trim().toLowerCase(Locale.ROOT))
        String localRepositoryPath = providers.gradleProperty("firefly.repositories.local.path")
                .orElse(providers.environmentVariable("FIREFLY_REPOSITORIES_LOCAL_PATH"))
                .orNull
        String dependencyMirrorUrl = providers.gradleProperty("firefly.repositories.maven.url")
                .orElse(providers.environmentVariable("FIREFLY_REPOSITORIES_MAVEN_URL"))
                .orNull
        String pluginMirrorUrl = providers.gradleProperty("firefly.repositories.plugin.url")
                .orElse(providers.environmentVariable("FIREFLY_REPOSITORIES_PLUGIN_URL"))
                .orElse(dependencyMirrorUrl ?: "")
                .orNull
        if (useMavenLocal) {
            mavenLocal()
        }
        if (localRepositoryPath != null && !localRepositoryPath.isBlank()) {
            maven { url = uri(localRepositoryPath) }
        }
        if (pluginMirrorUrl != null && !pluginMirrorUrl.isBlank()) {
            maven { url = uri(pluginMirrorUrl) }
        }
        gradlePluginPortal()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        String mavenLocalFlag = providers.gradleProperty("firefly.repositories.mavenLocal")
                .orElse(providers.environmentVariable("FIREFLY_REPOSITORIES_MAVEN_LOCAL"))
                .orNull
        boolean useMavenLocal = mavenLocalFlag != null
                && ["true", "1", "yes"].contains(mavenLocalFlag.trim().toLowerCase(Locale.ROOT))
        String localRepositoryPath = providers.gradleProperty("firefly.repositories.local.path")
                .orElse(providers.environmentVariable("FIREFLY_REPOSITORIES_LOCAL_PATH"))
                .orNull
        String dependencyMirrorUrl = providers.gradleProperty("firefly.repositories.maven.url")
                .orElse(providers.environmentVariable("FIREFLY_REPOSITORIES_MAVEN_URL"))
                .orNull
        if (useMavenLocal) {
            mavenLocal()
        }
        if (localRepositoryPath != null && !localRepositoryPath.isBlank()) {
            maven { url = uri(localRepositoryPath) }
        }
        if (dependencyMirrorUrl != null && !dependencyMirrorUrl.isBlank()) {
            maven { url = uri(dependencyMirrorUrl) }
        }
        mavenCentral()
    }
}

