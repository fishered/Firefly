plugins {
    id "java-library"
}

dependencies {
    api project(":plugins:plugin-api")
    implementation "io.opentelemetry:opentelemetry-sdk:1.44.1"
    implementation "io.opentelemetry:opentelemetry-exporter-otlp:1.44.1"

    testImplementation "io.opentelemetry:opentelemetry-sdk-testing:1.44.1"
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.2"
}
