name: publish-container-images

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 1.0.1
        required: true
        type: string
      publish_latest:
        description: Also update the latest tag
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: container-image-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 0

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Verify release source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          expected_version='${{ inputs.version }}'
          if [[ ! "$expected_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use MAJOR.MINOR.PATCH format."
            exit 1
          fi
          expected_tag="v${expected_version}"
          actual_tag="$(git describe --tags --exact-match HEAD)"
          if [[ "$actual_tag" != "$expected_tag" ]]; then
            echo "Checked out tag ${actual_tag} does not match ${expected_tag}."
            exit 1
          fi
          actual_version="$(./gradlew -q properties | sed -n 's/^version: //p' | head -n 1)"
          if [[ "$actual_version" != "$expected_version" ]]; then
            echo "Gradle version ${actual_version} does not match requested version ${expected_version}."
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            image: firefly
            context: .
            dockerfile: ./Dockerfile
          - name: admin
            image: firefly-admin
            context: ./ui/admin
            dockerfile: ./ui/admin/Dockerfile
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v${{ inputs.version }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ inputs.version }}
            type=raw,value=latest,enable=${{ inputs.publish_latest }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.verify.outputs.source_sha }}
            org.opencontainers.image.version=${{ inputs.version }}

      - name: Build and publish ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          build-args: |
            FIREFLY_VERSION=${{ inputs.version }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: mode=max
          sbom: true
