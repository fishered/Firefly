name: publish-maven-central

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 1.0.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: maven-central-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: maven-central
    env:
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
      SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify release tag and project version
        shell: bash
        run: |
          set -euo pipefail
          expected_version='${{ inputs.version }}'
          if [[ "$GITHUB_REF_TYPE" != "tag" || "$GITHUB_REF_NAME" != "v${expected_version}" ]]; then
            echo "Run this workflow from tag v${expected_version}."
            exit 1
          fi
          actual_version="$(./gradlew -q properties | sed -n 's/^version: //p' | head -n 1)"
          if [[ "$actual_version" != "$expected_version" ]]; then
            echo "Gradle version ${actual_version} does not match requested version ${expected_version}."
            exit 1
          fi

      - name: Verify release secrets
        shell: bash
        run: |
          set -euo pipefail
          for value in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD SIGNING_KEY SIGNING_PASSWORD; do
            if [[ -z "${!value:-}" ]]; then
              echo "Missing GitHub secret: ${value}"
              exit 1
            fi
          done

      - name: Verify publication artifacts
        run: ./gradlew --no-parallel --no-configuration-cache verifyMavenCentralPublication

      - name: Publish and release Maven Central artifacts
        run: ./gradlew --no-parallel --no-configuration-cache publishAndReleaseToMavenCentral
