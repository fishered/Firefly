name: ci

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/admin/package-lock.json
      - run: chmod +x gradlew
      - run: ./gradlew --no-parallel test
      - run: npm ci
        working-directory: ui/admin
      - run: npm run check
        working-directory: ui/admin
      - run: npx playwright install --with-deps chromium
        working-directory: ui/admin
      - run: npm run test:e2e
        working-directory: ui/admin

  real-database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - run: ./gradlew --no-parallel :stores:jdbc:realDatabaseTest
