name: ci

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/admin/package-lock.json
      - run: chmod +x gradlew
      - run: ./gradlew --no-parallel check verifyPluginCompatibilityMatrix
      - run: npm ci
        working-directory: ui/admin
      - run: npm run check
        working-directory: ui/admin
      - run: npx playwright install --with-deps chromium
        working-directory: ui/admin
      - run: npm run test:e2e
        working-directory: ui/admin

  real-database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - run: ./gradlew --no-parallel :stores:jdbc:realDatabaseTest

  spring-boot-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        spring-boot:
          - '3.3.5'
          - '3.4.12'
          - '3.5.8'
          - '4.0.0'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - run: mvn -v
      - run: ./gradlew --no-parallel verifySpringBootCompatibility -Pcompat.springBootVersions=${{ matrix.spring-boot }} -Pcompat.maven.executable=mvn
