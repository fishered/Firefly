<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Firefly v1.0.4 scheduling throughput comparison</title>
  <desc id="desc">Optimized scheduling throughput reaches 13,997.76 tasks per second at 50K tasks. The chart also shows the old baseline in a separate zoomed panel.</desc>
  <rect width="1280" height="760" fill="#f7f9fb"/>
  <rect x="32" y="28" width="1216" height="92" rx="6" fill="#17212b"/>
  <text x="62" y="66" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700">Scheduling throughput</text>
  <text x="62" y="96" fill="#b9c7d5" font-family="Segoe UI,Arial,sans-serif" font-size="15">Tasks cleared per second after the common due instant | partitioned topology | 8 scheduler threads</text>
  <text x="1040" y="68" fill="#54d69d" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700">13,998/s</text>
  <text x="1040" y="95" fill="#b9c7d5" font-family="Segoe UI,Arial,sans-serif" font-size="14">optimized 50K peak</text>

  <rect x="32" y="144" width="760" height="430" rx="6" fill="#fff" stroke="#d8e0e8"/>
  <text x="62" y="181" fill="#17212b" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">Full scale comparison</text>
  <rect x="530" y="158" width="16" height="16" fill="#e05d5d"/><text x="554" y="171" fill="#4d5d6c" font-family="Segoe UI,Arial,sans-serif" font-size="14">Before baseline</text>
  <rect x="658" y="158" width="16" height="16" fill="#168a70"/><text x="682" y="171" fill="#4d5d6c" font-family="Segoe UI,Arial,sans-serif" font-size="14">Optimized</text>
  <line x1="112" y1="500" x2="730" y2="500" stroke="#8e9baa"/><line x1="112" y1="215" x2="112" y2="500" stroke="#8e9baa"/>
  <g stroke="#e3e8ee"><line x1="112" y1="405" x2="730" y2="405"/><line x1="112" y1="310" x2="730" y2="310"/><line x1="112" y1="215" x2="730" y2="215"/></g>
  <g fill="#647586" font-family="Segoe UI,Arial,sans-serif" font-size="13" text-anchor="end"><text x="100" y="505">0</text><text x="100" y="410">5K</text><text x="100" y="315">10K</text><text x="100" y="220">15K</text></g>
  <g fill="#647586" font-family="Segoe UI,Arial,sans-serif" font-size="14" text-anchor="middle"><text x="190" y="529">5K</text><text x="360" y="529">10K</text><text x="530" y="529">20K</text><text x="700" y="529">50K</text></g>
  <g fill="#168a70"><rect x="170" y="395" width="40" height="105"/><rect x="340" y="297" width="40" height="203"/><rect x="510" y="297" width="40" height="203"/><rect x="680" y="234" width="40" height="266"/></g>
  <g fill="#e05d5d"><rect x="216" y="498" width="40" height="2"/><rect x="386" y="498" width="40" height="2"/><rect x="556" y="498" width="40" height="2"/><rect x="726" y="498" width="4" height="2"/></g>
  <g fill="#17212b" font-family="Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle"><text x="190" y="382">5,518.76</text><text x="360" y="284">10,672.36</text><text x="530" y="284">10,700.91</text><text x="700" y="221">13,997.76</text></g>
  <g fill="#b44848" font-family="Segoe UI,Arial,sans-serif" font-size="12" text-anchor="middle"><text x="236" y="488">120.78</text><text x="406" y="488">98.72</text><text x="576" y="488">93.38</text><text x="716" y="488">104.81</text></g>

  <rect x="818" y="144" width="430" height="430" rx="6" fill="#fff" stroke="#d8e0e8"/>
  <text x="848" y="181" fill="#17212b" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">Baseline detail (0-140/s)</text>
  <text x="848" y="207" fill="#647586" font-family="Segoe UI,Arial,sans-serif" font-size="13">The old bars are too small to read on the full scale.</text>
  <line x1="884" y1="500" x2="1214" y2="500" stroke="#8e9baa"/><line x1="884" y1="235" x2="884" y2="500" stroke="#8e9baa"/>
  <g stroke="#e3e8ee"><line x1="884" y1="405" x2="1214" y2="405"/><line x1="884" y1="310" x2="1214" y2="310"/><line x1="884" y1="235" x2="1214" y2="235"/></g>
  <g fill="#647586" font-family="Segoe UI,Arial,sans-serif" font-size="12" text-anchor="end"><text x="874" y="505">0</text><text x="874" y="410">50</text><text x="874" y="315">100</text><text x="874" y="240">140</text></g>
  <g fill="#e05d5d"><rect x="900" y="270" width="48" height="230"/><rect x="980" y="313" width="48" height="187"/><rect x="1060" y="323" width="48" height="177"/><rect x="1140" y="301" width="48" height="199"/></g>
  <g fill="#17212b" font-family="Segoe UI,Arial,sans-serif" font-size="12" text-anchor="middle"><text x="924" y="258">120.78</text><text x="1004" y="301">98.72</text><text x="1084" y="311">93.38</text><text x="1164" y="289">104.81</text></g>
  <g fill="#647586" font-family="Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle"><text x="924" y="529">5K</text><text x="1004" y="529">10K</text><text x="1084" y="529">20K</text><text x="1164" y="529">50K</text></g>
  <rect x="848" y="544" width="360" height="1" fill="#e3e8ee"/>
  <text x="848" y="565" fill="#b44848" font-family="Segoe UI,Arial,sans-serif" font-size="13">Before: 93-121 tasks/s</text>

  <rect x="32" y="600" width="1216" height="102" rx="6" fill="#eef6f3" stroke="#cce8df"/>
  <text x="62" y="635" fill="#168a70" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">Interpretation</text>
  <text x="62" y="663" fill="#314252" font-family="Segoe UI,Arial,sans-serif" font-size="14">Batch persistence removes the one-transaction-per-task bottleneck. Optimized throughput scales from 5.5K/s at 5K tasks to 14.0K/s at 50K.</text>
  <text x="62" y="687" fill="#647586" font-family="Segoe UI,Arial,sans-serif" font-size="13">Throughput = task count / scheduling clear time. Registration and Outbox completion are excluded from this metric.</text>
</svg>
