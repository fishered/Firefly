plugins {
    id "java-library"
}

dependencies {
    implementation project(":server:launcher")

    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.2"
}

tasks.named("test") {
    useJUnitPlatform {
        excludeTags("process-fault")
    }
}

tasks.register("processFaultBenchmark", Test) {
    description = "Runs process-level Firefly fault-injection and punctuality benchmarks."
    group = "verification"
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags("process-fault")
    }
    systemProperty "firefly.benchmark.report.dir",
            providers.gradleProperty("firefly.benchmark.report.dir")
                    .orElse(layout.buildDirectory.dir("reports/process-faults").map { it.asFile.absolutePath })
                    .get()
    systemProperty "firefly.benchmark.task.count",
            providers.gradleProperty("firefly.benchmark.task.count").orElse("10000").get()
}
